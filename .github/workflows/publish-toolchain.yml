name: Publish LOG736 toolchain

on:
  push:
    branches:
      - main
    paths:
      - Containerfile
      - .github/workflows/publish-toolchain.yml

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ets-log736/toolchain

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ghcr.io/ets-log736/toolchain:a2026
